services:
  backend-tests:
    build:
      context: .
      target: python-tests
    environment:
      LABOS_ENVIRONMENT: local
    volumes:
      - ./reports:/workspace/reports

  ui-tests:
    build:
      context: .
      target: ui-tests
    init: true
    volumes:
      - ./reports:/workspace/reports

  performance-tests:
    image: ${K6_IMAGE:-grafana/k6}
    profiles:
      - performance
    environment:
      LABOS_API_BASE_URL: ${LABOS_API_BASE_URL:-}
      LABOS_ORDER_ID: ${LABOS_ORDER_ID:-}
      LABOS_API_TOKEN: ${LABOS_API_TOKEN:-}
      VUS: ${VUS:-5}
      DURATION: ${DURATION:-30s}
      ITERATION_PAUSE_SECONDS: ${ITERATION_PAUSE_SECONDS:-0.1}
      K6_SUMMARY_EXPORT: /reports/performance/orders-smoke-summary.json
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /reports/performance/orders-smoke-report.html
      K6_WEB_DASHBOARD_PERIOD: ${K6_WEB_DASHBOARD_PERIOD:-1s}
      K6_WEB_DASHBOARD_PORT: "-1"
    volumes:
      - ./tests/performance:/scripts:ro
      - ./reports:/reports
    command:
      - run
      - /scripts/orders-smoke.js
