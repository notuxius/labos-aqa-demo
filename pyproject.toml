[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "labos-aqa-demo"
version = "0.1.0"
description = "Production-style Python AQA demo framework for LabOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
]

[tool.uv.build-backend]
module-name = "labos_demo"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "smoke: fast public smoke coverage",
    "contract: deterministic API contract coverage",
    "api: API-focused coverage",
    "e2e: critical business-flow coverage",
    "integration: service and database integration coverage",
    "live: calls the public LabOS website",
    "performance: response-time and performance checks",
    "security: authentication and security-focused checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["labos_demo"]
